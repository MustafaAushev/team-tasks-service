        пагинация, как у истории: продолжение с `id` больше последнего прочитанного, поэтому комментарии,
        добавленные между страницами, появятся в конце без повторов. Комментарии исключённого автора
        сохраняются с прежним авторством; сам исключённый пользователь доступа к ним больше не имеет.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница комментариев.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
              examples:
                firstPage:
                  summary: Первая страница (?limit=1), есть продолжение
                  value:
                    items:
                      - id: 019a246b-3000-7a77-a555-445566778899
                        task_id: 019a246a-1000-7d44-b222-112233445566
                        user_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f15
                        content: Проверил миграции, можно выпускать
                        created_at: '2026-01-15T14:00:00.000000Z'
                    pagination:
                      mode: cursor
                      limit: 1
                      next_cursor: eyJrIjoidGFza19jb21tZW50cyIsInRlYW0iOiIwMTlhMjQ2OC0wYTAwLTdiMTEtOWMyMi0zZDRlNWY2MDcxODIiLCJ0YXNrIjoiMDE5YTI0NmEtMTAwMC03ZDQ0LWIyMjItMTEyMjMzNDQ1NTY2IiwibGFzdF9pZCI6IjAxOWEyNDZiLTMwMDAtN2E3Ny1hNTU1LTQ0NTU2Njc3ODg5OSJ9.mT8q2Lw0vR5yA1cB3dE7fG9hJ2kN4pQ6sU8wX0zY1aQ
                lastPage:
                  summary: Следующая страница (?limit=1&cursor=<next_cursor>), конец
                  value:
                    items:
                      - id: 019a246b-4000-7b88-b666-5566778899aa
                        task_id: 019a246a-1000-7d44-b222-112233445566
                        user_id: 019a2469-5b00-7c33-a111-0a1b2c3d4e5f
                        content: Согласен
                        created_at: '2026-01-15T14:05:00.000000Z'
                    pagination:
                      mode: cursor
                      limit: 1
                      next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health/live:
    get:
      tags: [Service]
      operationId: healthLive
      summary: Процесс жив
      security: []
      responses:
        '200':
          description: Процесс работает.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /health/ready:
    get:
      tags: [Service]
      operationId: healthReady
      summary: Готовность (MySQL и версия схемы)
      description: Redis условием готовности не является.
      security: []
      responses:
        '200':
          description: MySQL доступен, схема актуальна.
          content:
            application/json:
              schema:
                type: object
                required: [status, schema_version]
                properties:
                  status:
                    type: string
                    example: ok
                  schema_version:
                    type: integer
                    example: 1
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token из `POST /login`. `sub` содержит UUIDv7 пользователя.
  parameters:
    TeamId:
      name: id
      in: path
      required: true
      description: UUIDv7 команды.
      schema:
        $ref: '#/components/schemas/UUIDv7'
    StatsTeamId:
      name: team_id
      in: path
      required: true
      description: UUIDv7 команды. Имя параметра — как в ТЗ для отчёта.
      schema:
        $ref: '#/components/schemas/UUIDv7'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    TaskId:
      name: id
      in: path
      required: true
      description: UUIDv7 задачи.
      schema:
        $ref: '#/components/schemas/UUIDv7'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Значение `next_cursor` из предыдущего ответа, передаётся целиком без разбора.
      schema:
        type: string
  responses:
    InvalidJSON:
      description: Некорректный JSON (`invalid_json`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_json
            message: Некорректный JSON
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f20
    Unauthorized:
      description: Токен отсутствует, просрочен или недействителен (`unauthorized`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Требуется действительный токен доступа
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f21
    Forbidden:
      description: |
        Недостаточно прав внутри доступной команды (`forbidden`): например, member приглашает, admin
        меняет роль, исполнитель передаёт `title` чужой задачи. Неучастник команды получает 404, а не 403.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Недостаточно прав для операции
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f22
    NotFound:
      description: Ресурс отсутствует либо принадлежит недоступной команде (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Ресурс не найден
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f23
    Conflict:
      description: Конфликт состояния, например повторное приглашение (`member_already_exists`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: member_already_exists
            message: Пользователь уже состоит в команде
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f24
    TooLarge:
      description: Тело запроса больше 1 MiB (`request_too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: request_too_large
            message: Тело запроса превышает 1 MiB
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f25
    Validation:
      description: |
        Ошибка валидации. Коды: `validation_error` (поля — в `details.fields`), `invalid_cursor`
        (курсор повреждён или выдан для другой выборки), `assignee_not_in_team`, `owner_role_immutable`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_error
            message: Данные запроса не прошли проверку
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f26
            details:
              fields:
                id: ожидается UUID версии 7
    RateLimited:
      description: Превышен лимит запросов (`rate_limit_exceeded`).
      headers:
        Retry-After:
          description: Через сколько секунд повторить запрос.
          schema:
            type: integer
            example: 3
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limit_exceeded
            message: Слишком много запросов
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f27
    Internal:
      description: Внутренняя ошибка (`internal_error`); подробности клиенту не раскрываются.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: internal_error
            message: Внутренняя ошибка сервера
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f28
    Unavailable:
      description: Зависимость недоступна (`dependency_unavailable`). Это не конфликт версий.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: dependency_unavailable
            message: Зависимость временно недоступна, повторите запрос позже
            request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f29
  schemas:
    UUIDv7:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: UUID версии 7 (36 символов с дефисами, регистр hex не важен).
      example: 019a2467-2c00-7a23-8d49-b7c0a4e52f15
    NullableUUIDv7:
      type: string
      format: uuid
      nullable: true
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: UUID версии 7 или `null`.
      example: 019a2469-5b00-7c33-a111-0a1b2c3d4e5f
    Role:
      type: string
      enum: [owner, admin, member]
    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
      description: Допустимы любые переходы между статусами при наличии права.
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          description: Идентификатор корреляции (также заголовок `X-Request-ID`); не ID сущности.
        details:
          type: object
          additionalProperties: true
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          maxLength: 254
          example: ann@example.com
        password:
          type: string
          minLength: 8
          description: Не менее 8 символов и не более 72 байт в UTF-8; не усекается.
          writeOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          writeOnly: true
    User:
      type: object
      required: [id, email, name, created_at]
      description: Публичный профиль; пароль и хеш не возвращаются.
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Срок жизни токена в секундах.
        user:
          $ref: '#/components/schemas/User'
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    Team:
      type: object
      required: [id, name, created_by, created_at, role]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
        created_by:
          $ref: '#/components/schemas/UUIDv7'
        created_at:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/Role'
    Member:
      type: object
      required: [user_id, name, role]
      properties:
        user_id:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    Membership:
      type: object
      required: [team_id, user_id, role]
      properties:
        team_id:
          $ref: '#/components/schemas/UUIDv7'
        user_id:
          $ref: '#/components/schemas/UUIDv7'
        role:
          $ref: '#/components/schemas/Role'
    InviteRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          $ref: '#/components/schemas/UUIDv7'
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    RemoveMemberRequest:
      type: object
      additionalProperties: false
      properties:
        confirm_unassign:
          type: boolean
          default: false
          description: '`true` подтверждает снятие всех назначений участника в команде.'
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [team_id, title]
      properties:
        team_id:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 10000
          default: ''
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee_id:
          $ref: '#/components/schemas/NullableUUIDv7'
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: |
        Требуется хотя бы одно из `title`, `description`, `status`, `assignee_id`.
        Отсутствие ключа и `null` различаются: `null` допустим только для `assignee_id`.
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: Версия задачи, прочитанная клиентом (условие обновления, не новое значение).
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 10000
          description: Очищается пустой строкой; `null` недопустим.
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee_id:
          $ref: '#/components/schemas/NullableUUIDv7'
    Task:
      type: object
      required: [id, team_id, title, description, status, created_by, assignee_id, version, created_at, updated_at, closed_at]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        team_id:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        created_by:
          $ref: '#/components/schemas/UUIDv7'
        assignee_id:
          $ref: '#/components/schemas/NullableUUIDv7'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Числовая версия для оптимистической блокировки; не связана с версией UUID.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
    OffsetPagination:
      type: object
      required: [mode, limit, offset, total]
      properties:
        mode:
          type: string
          enum: [offset]
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    CursorPagination:
      type: object
      required: [mode, limit, next_cursor]
      properties:
        mode:
          type: string
          enum: [cursor]
        limit:
          type: integer
        next_cursor:
          type: string
          nullable: true
          description: Непрозрачный подписанный токен; `null` в конце списка.
    HistoryEntry:
      type: object
      required: [id, task_id, changed_by, task_version, changes, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        task_id:
          $ref: '#/components/schemas/UUIDv7'
        changed_by:
          $ref: '#/components/schemas/UUIDv7'
        task_version:
          type: integer
          format: int64
          minimum: 1
        changes:
          type: object
          description: Для каждого изменённого поля — пара `old`/`new`. ID внутри — строки UUIDv7 или `null`.
          additionalProperties:
            type: object
            required: [old, new]
            properties:
              old:
                nullable: true
              new:
                nullable: true
        created_at:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: Не может состоять только из пробелов.
    Comment:
      type: object
      required: [id, task_id, user_id, content, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        task_id:
          $ref: '#/components/schemas/UUIDv7'
        user_id:
          $ref: '#/components/schemas/UUIDv7'
        content:
          type: string
        created_at:
          type: string
          format: date-time
    TeamStats:
      type: object
      required: [as_of, tasks_by_status, top_assignees, average_close_time_days, comments_total]
      properties:
        as_of:
          type: string
          format: date-time
        tasks_by_status:
          type: object
          required: [todo, in_progress, done]
          properties:
            todo:
              type: integer
            in_progress:
              type: integer
            done:
              type: integer
        top_assignees:
          type: array
          maxItems: 3
          items:
            type: object
            required: [user_id, name, closed_tasks_count]
            properties:
              user_id:
                $ref: '#/components/schemas/UUIDv7'
              name:
                type: string
              closed_tasks_count:
                type: integer
        average_close_time_days:
          type: number
          nullable: true
        comments_total:
          type: integer
