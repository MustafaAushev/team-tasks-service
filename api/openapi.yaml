    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Список задач команды
      description: |
        Обязательный `team_id` проверяется на членство. Фильтры `status` и `assignee_id` объединяются по И.
        Порядок — `id` по убыванию.

        * `pagination=offset` (по умолчанию): ответ содержит `total`; режим оставлен для совместимости.
        * `pagination=cursor`: первая страница без `cursor`, следующая — с `next_cursor` из ответа,
          переданным целиком; `null` — конец списка. Следующая страница содержит задачи с `id` меньше
          последнего прочитанного, поэтому новые задачи (с бо́льшими UUIDv7) не вызывают повторов.
          `offset` в этом режиме запрещён, `total` не возвращается, `limit` можно менять. Смена команды
          или фильтров при продолжении, повреждённый или чужой курсор — 422 `invalid_cursor`.
          Сервер курсоры не хранит: позиция восстанавливается из подписанного токена.

        Отдельные страницы не образуют общего снимка: изменения между запросами могут менять состав
        следующих страниц.
      parameters:
        - name: team_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: assignee_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UUIDv7'
        - name: pagination
          in: query
          required: false
          schema:
            type: string
            enum: [offset, cursor]
            default: offset
        - $ref: '#/components/parameters/Limit'
        - name: offset
          in: query
          required: false
          description: Только для `pagination=offset`.
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница задач.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    oneOf:
                      - $ref: '#/components/schemas/OffsetPagination'
                      - $ref: '#/components/schemas/CursorPagination'
              examples:
