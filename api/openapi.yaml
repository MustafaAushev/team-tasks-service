openapi: 3.0.3
info:
  title: Team Tasks Service API
  version: 1.0.0
  description: |
    REST API управления задачами в командах.

    ## Общие правила

    * **Идентификаторы** пользователей, команд, задач, записей истории и комментариев — строки
      UUID **версии 7** (`019a2467-2c00-7a23-8d49-b7c0a4e52f15`). Во входных данных регистр hex
      не важен, в ответах всегда нижний. Числа, nil UUID и UUID других версий отклоняются с HTTP 422.
      Версия UUID не связана с числовым полем `version` задачи.
    * **Аутентификация.** Все маршруты `/api/v1`, кроме `POST /register` и `POST /login`, требуют
      заголовок `Authorization: Bearer <access_token>`. Роли в командах в токене не хранятся и
      проверяются по текущему членству на каждый запрос.
    * **Время** — RFC 3339 в UTC.
    * **Ошибки** имеют единый вид `{code, message, request_id, details?}`. Тело запроса — не более
      1 MiB; неизвестные поля отклоняются.
    * **Частичное обновление задачи** выполняется методом `PUT /tasks/{id}` (так задан контракт):
      передаются только изменяемые поля и **обязательная** `version`. Отсутствующее поле не меняется,
      `assignee_id: null` снимает исполнителя, `null` для остальных полей — ошибка 422.
    * **Оптимистическая блокировка.** Если `version` не совпала с текущей, возвращается 409
      `task_version_conflict` — даже при совпадающих значениях полей. Клиент заново читает задачу,
      сверяет правку и отправляет новый запрос; сервер версию сам не подставляет и изменения не сливает.
    * **Пагинация.** Задачи: `offset` (по умолчанию) или `cursor`. История и комментарии — только
      `cursor`. Клиент передаёт `next_cursor` из ответа как `cursor` целиком, без разбора; `null`
      означает конец списка.
    * **Роли** действуют внутри команды: owner — создатель команды (единственный, неизменный), admin
      и member назначаются. Права — по ТЗ, трактовки — в README («Допущения и ограничения» → «Команды и
      роли»). Чужая команда и её ресурсы неотличимы от несуществующих (404).
    * `DELETE /teams/{id}/members/{user_id}` принимает необязательное **JSON-тело**
      `{"confirm_unassign": true}`: клиент должен передавать тело, а не только URL.
servers:
  - url: http://localhost:8080
    description: Локальный запуск через Docker Compose
tags:
  - name: Auth
  - name: Teams
  - name: Tasks
  - name: History and comments
  - name: Statistics
  - name: Service
security:
  - bearerAuth: []
paths:
  /api/v1/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Регистрация пользователя
      description: |
        Создаёт учётную запись без подтверждения email — для входа достаточно зарегистрироваться.
        Владение адресом не проверяется (см. README, «Допущения и ограничения»). Email
        нормализуется: внешние пробелы удаляются, регистр приводится к нижнему.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: ann@example.com
              password: correct horse battery
              name: Ann
      responses:
        '201':
          description: Пользователь создан. Поле `id` — идентификатор, который коллеги используют для приглашения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 019a2467-2c00-7a23-8d49-b7c0a4e52f15
                email: ann@example.com
                name: Ann
                created_at: '2026-01-15T10:00:00.123456Z'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '409':
          description: Email уже зарегистрирован (`email_already_exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: email_already_exists
                message: Пользователь с таким email уже зарегистрирован
                request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f16
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вход и получение JWT
      description: |
        Возвращает access token (HS256) со сроком жизни из настройки `JWT_TTL` (1 час по умолчанию).
        Для неизвестного email и неверного пароля ответ одинаков (`invalid_credentials`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ann@example.com
              password: correct horse battery
      responses:
        '200':
          description: Вход выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTlhMjQ2Ny0yYzAwLTdhMjMtOGQ0OS1iN2MwYTRlNTJmMTUifQ.signature
                token_type: Bearer
                expires_in: 3600
                user:
                  id: 019a2467-2c00-7a23-8d49-b7c0a4e52f15
                  email: ann@example.com
                  name: Ann
                  created_at: '2026-01-15T10:00:00.123456Z'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          description: Неверные реквизиты (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: invalid_credentials
                message: Неверный email или пароль
                request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f17
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/teams:
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Создать команду
      description: Создаёт команду; текущий пользователь становится её единственным владельцем (`owner`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
            example:
              name: Platform
      responses:
        '201':
          description: Команда создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              example:
                id: 019a2468-0a00-7b11-9c22-3d4e5f607182
                name: Platform
                created_by: 019a2467-2c00-7a23-8d49-b7c0a4e52f15
                created_at: '2026-01-15T10:05:00.000000Z'
                role: owner
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Свои команды
      description: Возвращает все команды текущего пользователя с его ролью, порядок по `id` по возрастанию.
      responses:
        '200':
          description: Список команд.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
              example:
                items:
                  - id: 019a2468-0a00-7b11-9c22-3d4e5f607182
                    name: Platform
                    created_by: 019a2467-2c00-7a23-8d49-b7c0a4e52f15
                    created_at: '2026-01-15T10:05:00.000000Z'
                    role: owner
                  - id: 019a2468-7f00-7c12-8d33-4e5f60718293
                    name: Mobile
                    created_by: 019a2469-5b00-7c33-a111-0a1b2c3d4e5f
                    created_at: '2026-01-16T08:00:00.000000Z'
                    role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/teams/{id}/members:
    get:
      tags: [Teams]
      operationId: listMembers
      summary: Состав команды
      description: Доступно участникам команды. Порядок по `user_id` по возрастанию.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Участники команды.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
              example:
                items:
                  - user_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f15
                    name: Ann
                    role: owner
                  - user_id: 019a2469-5b00-7c33-a111-0a1b2c3d4e5f
                    name: Bob
                    role: member
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/teams/{id}/invite:
    post:
      tags: [Teams]
      operationId: inviteMember
      summary: Пригласить пользователя по ID
      description: |
        Доступно owner и admin. Пользователь добавляется **немедленно** с ролью `member`, принятие
        приглашения и почта не требуются. Поле `role` отклоняется (422): роль `admin` назначает owner
        отдельным запросом смены роли. Приглашаемый сам сообщает свой ID из ответа регистрации или входа
        (поиска пользователей нет).

        Ответы: неучастник команды — 404 (команда не раскрывается); member — 403; отсутствующий
        пользователь — 404; уже участник — 409 `member_already_exists`.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
            example:
              user_id: 019a2469-5b00-7c33-a111-0a1b2c3d4e5f
      responses:
        '201':
          description: Участник добавлен с ролью `member`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
              example:
                team_id: 019a2468-0a00-7b11-9c22-3d4e5f607182
                user_id: 019a2469-5b00-7c33-a111-0a1b2c3d4e5f
                role: member
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          description: Некорректное тело, в том числе попытка передать `role` (`validation_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: validation_error
                message: Данные запроса не прошли проверку
                request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f30
                details:
                  fields:
                    role: неизвестное поле
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/teams/{id}/members/{user_id}/role:
    put:
      tags: [Teams]
      operationId: changeMemberRole
      summary: Сменить роль участника
      description: |
        Только owner назначает существующему участнику роль `admin` или `member`. Роль и членство
        owner неизменны; назначить owner нельзя (422). Admin роли не меняет никому (403): в ТЗ право
        «менять роли» перечислено только у owner, а для admin указан лишь запрет менять роль создателя
        (подробно — README, «Допущения и ограничения» → «Команды и роли»). Новая роль действует со
        следующего запроса без перевыдачи токена: права читаются из MySQL.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
            example:
              role: admin
      responses:
        '200':
          description: Роль изменена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
              example:
                team_id: 019a2468-0a00-7b11-9c22-3d4e5f607182
                user_id: 019a2469-5b00-7c33-a111-0a1b2c3d4e5f
                role: admin
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          description: Недопустимая роль (`validation_error`) или попытка изменить роль владельца (`owner_role_immutable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                grantOwner:
                  summary: Выдать роль owner нельзя
                  value:
                    code: validation_error
                    message: Данные запроса не прошли проверку
                    request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f31
                    details:
                      fields:
                        role: допустимы только admin и member
                ownerImmutable:
                  summary: Роль владельца неизменна
                  value:
                    code: owner_role_immutable
                    message: Роль владельца команды изменить нельзя
                    request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f32
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/teams/{id}/members/{user_id}:
    delete:
      tags: [Teams]
      operationId: removeMember
      summary: Исключить участника (с подтверждением снятия назначений)
      description: |
        Доступно owner и admin. Нельзя исключить owner или самого себя (422).

        **Два шага при наличии назначений.** Если у участника есть назначенные задачи команды
        (в любом статусе), а `confirm_unassign` не равен `true`, возвращается 409
        `member_has_assigned_tasks` с `details.assigned_tasks_count`, ничего не меняется.
        Повторите запрос **с JSON-телом** `{"confirm_unassign": true}`: все назначения на момент
        второго запроса будут сняты (с записью в историю), затем участник исключён.
        Без назначений подтверждение не требуется. Повтор запроса для уже исключённого участника
        возвращает 204 (права отправителя проверяются и при повторе).

        **Область подтверждения** — все задачи **этой** команды, назначенные участнику на момент второго
        запроса, в любом статусе, включая появившиеся после предупреждения; число из 409 не резервируется.

        **Побочные изменения** (одна транзакция, при ошибке откатывается всё): у каждой такой задачи
        `assignee_id` становится `null`, `version` увеличивается на 1, `updated_at` обновляется, статус и
        `closed_at` не меняются; в историю пишется запись `{"assignee_id": {"old": "<user_id>", "new": null}}`
        с автором — тем, кто исключает. Затем удаляется членство, кешированные списки задач команды
        сбрасываются. Учётная запись, авторство задач и комментариев, назначения и членства в других
        командах сохраняются. Клиенты, прочитавшие такую задачу раньше, получат на PUT со старой
        `version` 409 `task_version_conflict`. Исключённый пользователь со старым JWT получает 404.

        ```
        DELETE /api/v1/teams/{id}/members/{user_id}                           → 409, assigned_tasks_count: 2
        DELETE /api/v1/teams/{id}/members/{user_id}  {"confirm_unassign":true} → 204
        ```
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveMemberRequest'
            examples:
              confirm:
                summary: Подтверждение снятия назначений
                value:
                  confirm_unassign: true
      responses:
        '204':
          description: Участник исключён (или уже не состоит в команде).
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: У участника есть назначенные задачи, подтверждение не получено (`member_has_assigned_tasks`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: member_has_assigned_tasks
                message: У участника есть назначенные задачи
                request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f18
                details:
                  assigned_tasks_count: 2
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          description: |
            `owner_cannot_be_removed` — владельца исключить нельзя; `self_removal_not_supported` —
            самостоятельный выход не поддерживается; `validation_error` — `confirm_unassign` не boolean,
            лишние поля или ID пути не UUIDv7.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                owner:
                  summary: Попытка исключить владельца
                  value:
                    code: owner_cannot_be_removed
                    message: Владельца команды исключить нельзя
                    request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f31
                self:
                  summary: Исключение самого себя
                  value:
                    code: self_removal_not_supported
                    message: Самостоятельный выход из команды не поддерживается
                    request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f32
                flag:
                  summary: confirm_unassign не boolean
                  value:
                    code: validation_error
                    message: Данные запроса не прошли проверку
                    request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f33
                    details:
                      fields:
                        confirm_unassign: ожидается true или false
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/teams/{team_id}/stats:
    get:
      tags: [Statistics]
      operationId: getTeamStats
      summary: Статистика команды
      description: |
        Доступно owner и admin (member получает 403, неучастник — 404). Все метрики считаются одним
        SQL-запросом на единый момент `as_of` (UTC).

        * `tasks_by_status` — текущие задачи по статусам, включая нули.
        * `top_assignees` — до трёх **текущих** исполнителей по числу задач `done` с `closed_at` в
          интервале `[as_of − 30 суток, as_of]`; порядок: число по убыванию, затем `user_id` по возрастанию.
        * `average_close_time_days` — среднее время от `created_at` до `closed_at` всех текущих `done`
          за всё время, в сутках по 24 часа, 6 знаков; `null` без закрытых задач.
        * `comments_total` — общее число комментариев к задачам команды.

        Метрики считаются по **текущему** состоянию задач, а не по журналу: переназначенная закрытая задача
        засчитывается новому исполнителю, снятие исполнителя или исключение участника убирает его задачи из
        топа, повторно открытая задача не считается закрытой до нового закрытия.
      parameters:
        - $ref: '#/components/parameters/StatsTeamId'
      responses:
        '200':
          description: Отчёт по команде.
