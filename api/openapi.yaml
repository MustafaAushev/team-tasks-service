    put:
      tags: [Tasks]
      operationId: updateTask
      summary: Частично обновить задачу
      description: |
        Меняет только переданные поля из `title`, `description`, `status`, `assignee_id`; требуется
        хотя бы одно из них. **`version` обязательна** — это версия задачи, прочитанная клиентом, а не
        новое значение. Три состояния поля: нет ключа — без изменений; значение — изменить;
        `null` допустим **только** для `assignee_id` (снимает исполнителя). Описание очищается пустой строкой.

        Права: owner/admin меняют любые задачи; member — все четыре поля своей задачи (автор) и только
        `status` чужой назначенной на него задачи. Право проверяется для каждого переданного поля.

        При несовпадении `version` — 409 `task_version_conflict` с `details.expected_version`
        (присланная) и `details.current_version`, даже если значения полей совпадают. Если версия верна,
        но фактических изменений нет, возвращается 200 без новой версии и записи в историю. Одна операция
        с несколькими полями увеличивает `version` один раз.

        Серверные поля (`id`, `team_id`, `created_by`, `created_at`, `updated_at`, `closed_at`) отклоняются.

        **Статусы.** `todo`, `in_progress`, `done`, любые переходы. Переход в `done` ставит `closed_at`,
        выход из `done` очищает его, изменение других полей закрытой задачи дату закрытия не сдвигает.

        **Сценарий конфликта.** 1) `GET /tasks/{id}` → `version: 3`. 2) Другой клиент успел обновить
        задачу до версии 4. 3) `PUT {"version": 3, "title": "…"}` → 409 с `expected_version: 3`,
        `current_version: 4`. 4) Клиент снова читает задачу, сверяет правку с новым состоянием и
        5) отправляет `PUT {"version": 4, "title": "…"}` → 200, `version: 5`.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            examples:
              partial:
                summary: Частичное обновление (прочитанная версия 3)
                value:
                  version: 3
                  status: done
              unassign:
                summary: Снять исполнителя
                value:
                  version: 4
                  assignee_id: null
              clearDescription:
                summary: Очистить описание пустой строкой
                value:
                  version: 5
                  description: ''
              retryAfterConflict:
                summary: Повтор после 409 и нового чтения (актуальная версия 4)
                value:
                  version: 4
                  title: Подготовить релиз 1.0
      responses:
        '200':
          description: Задача обновлена (или изменений не было).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 019a246a-1000-7d44-b222-112233445566
                team_id: 019a2468-0a00-7b11-9c22-3d4e5f607182
                title: Подготовить релиз
                description: Собрать changelog и проверить миграции
                status: done
                created_by: 019a2467-2c00-7a23-8d49-b7c0a4e52f15
                assignee_id: 019a2469-5b00-7c33-a111-0a1b2c3d4e5f
                version: 4
                created_at: '2026-01-15T11:00:00.000000Z'
                updated_at: '2026-01-15T13:00:00.000000Z'
                closed_at: '2026-01-15T13:00:00.000000Z'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Версия задачи изменилась (`task_version_conflict`). Прочитайте задачу заново и повторите правку с актуальной `version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: task_version_conflict
                message: Версия задачи изменилась
                request_id: 019a2467-2c00-7a23-8d49-b7c0a4e52f19
                details:
                  expected_version: 3
                  current_version: 4
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
