# Redis используется только как кеш списков задач.
# Память ограничивает сам Redis: при достижении лимита вытесняются наименее часто
# используемые ключи (LFU), в том числе до истечения TTL. Вытеснение — обычный промах кеша.
maxmemory 128mb
maxmemory-policy allkeys-lfu

# Кеш не нужно сохранять на диск: после перезапуска он начинается пустым.
save ""
appendonly no
