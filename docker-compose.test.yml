# Зависимости для автотестов: настоящие MySQL и Redis на отдельных портах, данные в памяти.
# Не пересекается с рабочим docker-compose.yml (другое имя проекта и порты).
name: team-tasks-test

services:
  mysql:
    image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      MYSQL_DATABASE: tasks_test
      MYSQL_USER: tasks
      MYSQL_PASSWORD: taskspw
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptestroot --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Отдельный Redis для теста вытеснения: та же политика allkeys-lfu, что и в deploy/redis.conf,
  # но маленький maxmemory, чтобы вытеснение наступало без заполнения 128 MiB.
  redis-evict:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "8mb", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
